name = "keystore2-verify"
version = "0.1.0"
defaultTargets = ["Keystore2Verify"]

# The Lean backend of Aeneas, at the release whose `aeneas` and `charon` made the translation.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "nightly-2026.11.09-5a392f4"
subDir = "backends/lean"

# Rust paths in the generated translation can contain double underscores.
[[lean_lib]]
name = "Keystore2Verify.Extraction"
srcDir = "formal"
globs = ["Keystore2Verify.Extraction.+"]
leanOptions = { weak.linter.style.nameCheck = false }

# Handwritten laws and recalls (Specs) and theorem origins (Proofs) use the default linters.
[[lean_lib]]
name = "Keystore2Verify"
srcDir = "formal"
globs = ["Keystore2Verify.Specs.+", "Keystore2Verify.Proofs.+"]
